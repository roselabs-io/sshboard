# Release on merge — after `sshboard CI` succeeds for a push to main.
#
# The `tag` job reads the first `## [X.Y.Z]` heading of CHANGELOG.md
# at the pushed commit; `[Unreleased]` and prerelease headings such as
# `[0.0.1-dev]` do not match. When the tag vX.Y.Z does not exist, it
# creates the tag on that commit, and the `release` job calls
# release.yml with it. A tag pushed with GITHUB_TOKEN starts no
# workflow, so release.yml's `push: tags` trigger does not run as well.
#
# This runs on `workflow_run` rather than as a job of sshboard-ci.yml
# because sshboard-ci.yml cancels its in-progress run on a newer push
# to main, which could stop a release between the tag and the GitHub
# Release. A CI run that is cancelled or fails releases nothing; the
# next successful push to main still finds the tag missing and
# releases from its own commit.

name: Release on merge

on:
  workflow_run:
    workflows: [sshboard CI]
    types: [completed]
    branches: [main]

concurrency:
  group: release-on-merge
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tag:
    name: Tag the CHANGELOG version
    # A dispatched exact-head run of sshboard CI also runs on main; only
    # the run of a push to main is a merge.
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Create the tag when it does not exist
        id: tag
        run: |
          version=$(awk -F'[][]' '/^## \[[0-9]+\.[0-9]+\.[0-9]+\]/ { print $2; exit }' CHANGELOG.md)
          if [ -z "$version" ]; then
            echo "CHANGELOG.md has no released version heading; nothing to release"
            exit 0
          fi
          tag="v${version}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null; then
            echo "${tag} exists; nothing to release"
            exit 0
          fi
          git tag "${tag}"
          git push origin "refs/tags/${tag}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

  release:
    name: Release
    needs: tag
    if: needs.tag.outputs.tag != ''
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
    secrets: inherit
