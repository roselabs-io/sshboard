# Release — triggered by pushing a tag matching v*.
#
# Builds the 6-platform release matrix, packages each as a
# .tar.gz (Unix) or .zip (Windows), generates a sha256 checksums
# manifest, and attaches everything to a GitHub Release with
# auto-generated release notes.

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64, ext: .exe }
          - { goos: windows, goarch: arm64, ext: .exe }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          go build \
            -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
            -trimpath \
            -o dist/sshboard${{ matrix.ext }} .

      - name: Package
        run: |
          cd dist
          archive_base="sshboard-${GITHUB_REF_NAME}-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip "../${archive_base}.zip" sshboard.exe
          else
            tar -czf "../${archive_base}.tar.gz" sshboard
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: sshboard-${{ matrix.goos }}-${{ matrix.goarch }}
          path: sshboard-*-${{ matrix.goos }}-${{ matrix.goarch }}.*
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum sshboard-*-*.{tar.gz,zip} 2>/dev/null > checksums.txt
          cat checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/sshboard-*-*.tar.gz
            dist/sshboard-*-*.zip
            dist/checksums.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
