# Release — triggered by pushing a tag matching v*, or called by
# release-on-merge.yml with the tag it created as the input `tag`.
# Under workflow_call github.ref_name is the caller's branch, so the
# jobs read the tag from TAG: the input, else github.ref_name.
#
# Builds the 6-platform release matrix, packages each as a
# .tar.gz (Unix) or .zip (Windows), generates a sha256 checksums
# manifest, and attaches everything to a GitHub Release with
# auto-generated release notes.
#
# For a tag that is not a prerelease, the homebrew job then sends a
# repository_dispatch event (type `formula-update`, payload `tool`, `tag`)
# to roselabs-io/homebrew-tools, whose workflow updates
# Formula/sshboard.rb. GITHUB_TOKEN cannot reach another repository,
# so the dispatch uses HOMEBREW_TAP_TOKEN, a token that can write to
# roselabs-io/homebrew-tools. It is a secret of the Bitwarden project
# `roselabs-ci`, whose id is the organization variable
# BWS_SHARED_PROJECT_ID; the dispatch step reads it with `bws run`,
# authenticated by the secret BWS_ACCESS_TOKEN, which
# release-on-merge.yml passes with `secrets: inherit`
# (`dependencies-security-posture.md` of the org layer, Secrets in CI).

name: Release

on:
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      tag:
        description: The tag to release, vX.Y.Z
        required: true
        type: string

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64, ext: .exe }
          - { goos: windows, goarch: arm64, ext: .exe }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          go build \
            -ldflags "-s -w -X main.version=${TAG}" \
            -trimpath \
            -o dist/sshboard${{ matrix.ext }} .

      - name: Package
        run: |
          cd dist
          archive_base="sshboard-${TAG}-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip "../${archive_base}.zip" sshboard.exe
          else
            tar -czf "../${archive_base}.tar.gz" sshboard
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: sshboard-${{ matrix.goos }}-${{ matrix.goarch }}
          path: sshboard-*-${{ matrix.goos }}-${{ matrix.goarch }}.*
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum sshboard-*-*.{tar.gz,zip} 2>/dev/null > checksums.txt
          cat checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: |
            dist/sshboard-*-*.tar.gz
            dist/sshboard-*-*.zip
            dist/checksums.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ contains(env.TAG, '-') }}

  homebrew:
    name: Notify the Homebrew tap
    needs: release
    # A prerelease tag (one containing '-') does not update the formula.
    if: ${{ !contains(inputs.tag || github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      # `bws` 2.1.0 from the releases of bitwarden/sdk-sm, checked against its SHA-256 and run from $RUNNER_TEMP
      # (`dependencies-security-posture.md` of the org layer, Secrets in CI).
      - name: Install bws
        run: |
          case "$RUNNER_ARCH" in
            ARM64) target=aarch64-unknown-linux-gnu; sum=18253757286e119d450133a87eb463bf8c1ce418ce24c834f4f250d60cba6f9e ;;
            X64) target=x86_64-unknown-linux-gnu; sum=ba8233c3a4aee5d43e3c73bbd04d99e9bc5aba13bbbfd06d89b073abe732b860 ;;
            *) echo "::error::no bws build for runner architecture $RUNNER_ARCH"; exit 1 ;;
          esac
          curl -fsSL -o "$RUNNER_TEMP/bws.zip" "https://github.com/bitwarden/sdk-sm/releases/download/bws-v2.1.0/bws-$target-2.1.0.zip"
          echo "$sum  $RUNNER_TEMP/bws.zip" | sha256sum --check --quiet
          python3 -m zipfile -e "$RUNNER_TEMP/bws.zip" "$RUNNER_TEMP/bws"
          chmod +x "$RUNNER_TEMP/bws/bws"
          echo "$RUNNER_TEMP/bws" >> "$GITHUB_PATH"

      - name: Send repository_dispatch to roselabs-io/homebrew-tools
        env:
          BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
          BWS_PROJECT_ID: ${{ vars.BWS_SHARED_PROJECT_ID }}
        run: |
          # The variables expand in the shell `bws run` starts, where the secrets are set.
          # shellcheck disable=SC2016
          bws run --project-id "$BWS_PROJECT_ID" -- '
            test -n "$HOMEBREW_TAP_TOKEN" || { echo "::error::HOMEBREW_TAP_TOKEN is not in the Bitwarden project $BWS_PROJECT_ID"; exit 1; }
            GH_TOKEN=$HOMEBREW_TAP_TOKEN gh api repos/roselabs-io/homebrew-tools/dispatches \
              -f event_type=formula-update \
              -f "client_payload[tool]=sshboard" \
              -f "client_payload[tag]=$TAG"
          '
