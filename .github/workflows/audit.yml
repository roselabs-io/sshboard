name: Audit

# `just audit`: govulncheck over the Go module dependencies and the standard library of the Go version
# of `go.mod`. It needs the network (the module proxy and vuln.go.dev), so it runs here and not in the
# gate: on a PR or a push to `main` that changes `go.mod` or `go.sum`, and weekly on `main`. A finding
# fails the job.

on:
  pull_request:
    branches: [main]
    paths: [go.mod, go.sum]
  push:
    branches: [main]
    paths: [go.mod, go.sum]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set GOVERNOR_JOBS to the core count
        run: echo "GOVERNOR_JOBS=$(getconf _NPROCESSORS_ONLN)" >> "$GITHUB_ENV"

      - name: Audit
        run: just audit
